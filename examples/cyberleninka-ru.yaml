# Пример русскоязычного литобзора через CyberLeninka.
#
# Импортируйте этот файл в Papeer (Темы → Импорт YAML), затем запустите поиск.
# Ключ `lang_scope: ru` включает поиск ТОЛЬКО по русскоязычным источникам
# (сейчас — CyberLeninka); англоязычные провайдеры для таких осей не вызываются.
# У осей без `lang_scope` (или со значением `en`) поведение прежнее — только
# англоязычные базы.
#
# После поиска отметьте нужные статьи как approved и запустите скачивание —
# PDF придёт напрямую с cyberleninka.ru (Referer проставляется автоматически).
# Запросы к CyberLeninka идут не чаще раза в 2 секунды; если сайт всё же
# покажет капчу, провайдер пропускается до конца поиска.
#
# Ключевые слова сравниваются как подстроки, поэтому для русского языка
# указывайте основы слов без окончаний: «рекомендательн» найдёт и
# «рекомендательная система», и «рекомендательных систем».

topics:
  recsys_abiturient:
    description: "Рекомендательные системы для выбора вуза и специальности абитуриентами"
    lang_scope: ru
    year_min: 2015
    max_per_query: 30
    queries:
      - "рекомендательная система абитуриент выбор вуза"
      - "рекомендательная система выбор специальности"
      - "система поддержки принятия решений абитуриент"
      - "профориентация рекомендательная система старшеклассник"
    keywords_must:
      - "рекомендательн"
    keywords_boost:
      - "абитуриент"
      - "вуз"
      - "специальност"
      - "профориентац"
      - "образовательн"

  collaborative_filtering_ru:
    description: "Коллаборативная фильтрация и методы рекомендаций (русскоязычные публикации)"
    lang_scope: ru
    year_min: 2015
    max_per_query: 30
    queries:
      - "коллаборативная фильтрация рекомендательная система"
      - "матричная факторизация рекомендации"
      - "методы рекомендаций неявная обратная связь"
      - "гибридная рекомендательная система"
    keywords_must:
      - "рекомендательн"
    keywords_boost:
      - "коллаборативн"
      - "факторизац"
      - "машинного обучения"
      - "машинное обучение"
      - "нейронн"

  educational_datamining_ru:
    description: "Интеллектуальный анализ образовательных данных и цифровизация приёма в вузы"
    lang_scope: ru
    year_min: 2016
    max_per_query: 25
    queries:
      - "интеллектуальный анализ образовательных данных"
      - "прогнозирование успеваемости студентов машинное обучение"
      - "цифровизация приёмной кампании вуза"
      - "анализ данных абитуриентов приём вуз"
    keywords_must:
      - "образовательн"
    keywords_boost:
      - "успеваемост"
      - "студент"
      - "приемн"
      - "приёмн"
      - "машинного обучения"
      - "машинное обучение"
      - "прогнозирован"
